- name: png_3d_viewer_angled_top
  comment: Top (angled) 3D viewer PCB render in PNG format
  type: render_3d
  category: Images
  dir: Images
  options:
    output: '%f-top_angled%I%v.%x'
    auto_crop: true
    enable_crop_workaround: true
    rotate_x: 2
    rotate_y: -1
    rotate_z: 1
    zoom: -1
    height: 2000
    width: 2000
    ray_tracing: true
    force_stackup_colors: true
    orthographic: true
    transparent_background: true
    transparent_background_fuzz: 40

- name: png_3d_viewer_angled_bottom
  comment: Bottom (angled) 3D viewer PCB render in PNG format
  type: render_3d
  category: Images
  dir: Images
  options:
    output: '%f-bottom_angled%I%v.%x'
    auto_crop: true
    enable_crop_workaround: true
    rotate_x: 2
    rotate_y: -1
    rotate_z: -1
    zoom: -1
    height: 2000
    width: 2000
    view: 'bottom'
    ray_tracing: true
    force_stackup_colors: true
    orthographic: true
    transparent_background: true
    transparent_background_fuzz: 40

