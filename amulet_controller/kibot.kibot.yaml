# KiBot configuration file for KDT_Hierarchical Template
# KiCad 8.0

kibot:
  version: 1

filters:
  - name: exclude_testpoints
    comment: "Exclude only testpoints"
    type: generic
    exclude_any:
      - column: Reference
        regex: "TP"
  - name: only_testpoints
    comment: "Select only testpoints"
    type: generic
    include_only:
      - column: Reference
        regex: "TP"
  - name: only_testpoints_top
    comment: "Select only top testpoints"
    type: generic
    exclude_bottom: true
    include_only:
      - column: Reference
        regex: "TP"
    exclude_refs: 
      - MB*
  - name: only_testpoints_bottom
    comment: "Select only bottom testpoints"
    type: generic
    exclude_top: true
    include_only:
      - column: Reference
        regex: "TP"

global:
  dnp_cross_top_layer: 'F.DNP'
  dnp_cross_bottom_layer: 'B.DNP'
  out_dir: 'Generated'
  filters:
    - filter: 'Ignore environment.vars missing. kibot#528'
      number: 9
    - filter: Ignore missing KiCad 3D models, not in docker images
      number: 10
    - filter: 'Ignore multiple schematics warning (hierarchical schematic). kibot#594'
      number: 44


preflight:
  update_xml: true
  draw_fancy_stackup:
    gerber: 'gbr_gerbers'
    gerber_extension_only: True
    draw_stackup: True
    draw_vias: True
    columns:
      - 'material'
      - 'layer'
      - 'thickness'
      - 'dielectric'
      - 'layer_type'
      - 'gerber'
    note: "external layer thicknesses are specified after plating"

  include_table:
    outputs:
      - name: 'csv_testpoints_top'
        text_alignment: 'left'
        invert_columns_order: False
        border_width: 0.2
        header_rule_width: 0.2
        horizontal_rule_width: 0
        vertical_rule_width: 0
        top_rule_width: 0
      - name: 'csv_testpoints_bottom'
        text_alignment: 'right'
        invert_columns_order: True
        border_width: 0.2
        header_rule_width: 0.2
        horizontal_rule_width: 0
        vertical_rule_width: 0
        top_rule_width: 0

  check_zone_fills: true
  # Save ERC and DRC reports in Reports folders, in both HTML
  # erc:
  #   category: 'Schematics'
  #   dir: 'Reports'
  #   format: 'HTML, RPT'
  #   output: 'report_%f-%i%I%v.%x'
  # drc:
  #   category: 'PCB'
  #   dir: 'Reports'
  #   format: 'HTML, RPT'
  #   output: 'report_%f-%i%I%v.%x'

outputs:

- name: netlist
  comment: Schematic netlist in KiCad format
  type: netlist

# Interactive HTML Bill Of Materials
- name: html_bom_interactive
  comment: Interactive BOM in HTML format
  type: ibom
  dir: Manufacturing/Assembly
  options:
    extra_data_file: '%F.net'
    dark_mode: true
    show_fields: 'Value,Footprint,Manufacturer Part Number'
    group_fields: 'Value,Manufacturer Part Number'
    show_fabrication: true
    highlight_pin1: "selected"

# Classical CSV BOM
# Make sure to update PCB from schematic to get correct fields
- name: csv_bom
  comment: Bill of Materials in CSV format
  type: bom
  dir: Manufacturing/Assembly
  options:
    format: CSV
    csv:
      hide_pcb_info: true
      hide_stats_info: true
    group_fields: ['Manufacturer Part Number']

    columns:
      - "Row"
      - "Quantity Per PCB"
      - "References"
      - "Value"
      - "Datasheet"
      - "Footprint"
      - "Description"
      - "Manufacturer"
      - "Manufacturer Part Number"
      - "Supplier 1"
      - "Supplier Part Number 1"


# XLSX BOM with costs
- name: xlsx_costs_bom
  comment: Costs Bill of Materials in XLSX format
  type: bom
  dir: Manufacturing/Assembly
  options:
    format: XLSX
    count_smd_tht: true
    xlsx:
      title: 'Bill of Materials'
      logo: false
      style: modern-green
      kicost: true
      # specs: true
      # kicost_api_disable: KitSpace
    # pre_transform: _kicost_rename


# Gerbers (layers)
- name: gbr_gerbers
  comment: Gerbers in GBR format
  type: gerber
  category: 'PCB/Fabrication/Gerbers'
  dir: Manufacturing/Fabrication/Gerbers
  layers: ['copper', 'Edge.Cuts', 'F.Silkscreen', 'F.Mask', 'F.Paste', 'B.Silkscreen', 'B.Mask', 'B.Paste']
  options:
    subtract_mask_from_silk: true
    plot_footprint_refs: false
    plot_footprint_values: false

# Excellon drill map
- name: dxf_drill_map
  comment: Drill in Excellon format
  type: excellon
  category: 'PCB/Fabrication/Gerbers'
  dir: Manufacturing/Fabrication/Gerbers
  options:
    pth_and_npth_single_file: true
    map: 'dxf'
    output: '%f-PTH%I%v.%x' # will be overwritten with next step

# Excellon drill map
- name: drl_pth_npth
  comment: Drill in Excellon format
  type: excellon
  category: 'PCB/Fabrication/Gerbers'
  dir: Manufacturing/Fabrication/Gerbers
  options:
    pth_and_npth_single_file: false
    pth_id: 'PTH'
    npth_id: 'NPTH'

# Testpoints XLSX
- name: xlsx_testpoints
  comment: "Testpoint report"
  type: bom
  dir: Testing/Testpoints
  options:
    output: '%f-testpoints%I%v.%x'
    pre_transform: ['_kicost_rename']
    exclude_filter: 'only_testpoints'
    dnf_filter: '_null'
    exclude_marked_in_sch: false
    group_fields: []
    sort_style: ref
    use_aux_axis_as_origin: true
    ignore_dnf: false
    format: XLSX
    xlsx:
      title: 'Testpoints Report'
      logo: false
    footprint_type_values: 'SMT,THRU,'
    columns:
      - field: References
        name: Testpoint Ref.
      - field: Net Name
        name: Net
      - field: Net Class        
      - field: Footprint X
        name: X
      - field: Footprint Y
        name: Y
      - field: Footprint Side
        name: Side
      - field: Footprint Type
        name: Pad Type
      - field: Value
      - field: Footprint

# Testpoints CSV
- name: csv_testpoints
  comment: "Testpoint report in CSV format"
  type: bom
  dir: Testing/Testpoints
  options:
    output: '%f-testpoints%I%v.%x'
    csv:
      hide_pcb_info: True
      hide_stats_info: True
    pre_transform: ['_kicost_rename']
    exclude_filter: 'only_testpoints'
    dnf_filter: '_null'
    exclude_marked_in_sch: false
    group_fields: []
    sort_style: ref
    use_aux_axis_as_origin: true
    ignore_dnf: false
    format: CSV
    footprint_type_values: 'SMT,THRU,'
    columns:
      - field: References
        name: Testpoint Ref.
      - field: Net Name
        name: Net
      - field: Net Class        
      - field: Footprint X
        name: X
      - field: Footprint Y
        name: Y
      - field: Footprint Side
        name: Side
      - field: Footprint Type
        name: Pad Type
      - field: Value 
      - field: Footprint

# Testpoints CSV (Top)
- name: csv_testpoints_top
  comment: "Top testpoint report in CSV format"
  type: bom
  dir: Tables
  options:
    output: 'testpoints-top.%x'
    csv:
      hide_pcb_info: True
      hide_stats_info: True
    pre_transform: ['_kicost_rename']
    exclude_filter: 'only_testpoints_top'
    dnf_filter: '_null'
    exclude_marked_in_sch: false
    group_fields: []
    sort_style: ref
    use_aux_axis_as_origin: true
    ignore_dnf: false
    format: CSV
    footprint_type_values: 'SMT,THRU,'
    columns:
      - field: References
        name: Ref.
      - field: Value
        name: Net     
      - field: Footprint X
        name: X
      - field: Footprint Y
        name: Y

# Testpoints CSV (Bottom)
- name: csv_testpoints_bottom
  comment: "Bottom testpoint report in CSV format"
  type: bom
  dir: Tables
  options:
    output: 'testpoints-bottom.%x'
    csv:
      hide_pcb_info: True
      hide_stats_info: True
    pre_transform: ['_kicost_rename']
    exclude_filter: 'only_testpoints_bottom'
    dnf_filter: '_null'
    exclude_marked_in_sch: false
    group_fields: []
    sort_style: ref
    use_aux_axis_as_origin: true
    ignore_dnf: false
    format: CSV
    footprint_type_values: 'SMT,THRU,'
    columns:
      - field: References
        name: Ref.
      - field: Value
        name: Net     
      - field: Footprint X
        name: X
      - field: Footprint Y
        name: Y

